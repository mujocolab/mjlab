repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.14.10
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Sort imports with ruff
    - id: ruff
      name: sort imports with ruff
      args: [--select, I, --fix]
    # Run the formatter.
    - id: ruff-format
      name: format with ruff